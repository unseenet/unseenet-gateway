[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unseenet-gateway"
dynamic = ["version"]
description = "Gateways between Unseenet and other networks: Usenet, Nostr and Matrix (UN-RFC 0023)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andreas Lorensen" }]
requires-python = ">=3.11"
dependencies = [
    "unseenet>=0.6.5,<0.7",   # one minor version of the core at a time
    "websockets>=12",          # Nostr relays
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Usenet News",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
fast = ["coincurve>=20"]   # optional: faster Nostr signatures

[project.scripts]
unseenet-gateway = "unseenet_gateway.cli:main"

# Network adapters. Other packages add theirs in the same group.
[project.entry-points."unseenet_gateway.adapters"]
usenet = "unseenet_gateway.usenet.adapter:UsenetAdapter"
nostr = "unseenet_gateway.nostr.adapter:NostrAdapter"
matrix = "unseenet_gateway.matrix.adapter:MatrixAdapter"

[project.urls]
Homepage = "https://github.com/unseenet/unseenet-gateway"
Specification = "https://github.com/unseenet/unseenet/blob/main/rfc/un-rfc-0023.md"

[tool.setuptools.dynamic]
version = { attr = "unseenet_gateway.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
